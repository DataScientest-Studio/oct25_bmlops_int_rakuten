[project]
name = "recommsystem-rakuten"
version = "0.1.0"
description = "Content-based recommender system for Rakuten dataset"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "beautifulsoup4",
    "simplejson",
    "python-dateutil",
    "pytz",
    "psutil",
    "pymongo",
    "dotenv>=0.9.9",
    "pandas>=2.3.3",
    "tensorflow>=2.20.0",
]

[project.optional-dependencies]
heavy = [
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.10",
    "faiss-cpu>=1.13",
    "Pillow>=10.0",
    "lxml>=5.0",
]
dev = [
    "pytest",
    "matplotlib>=3.7",
    "ipykernel",
    "jedi",
    "Pygments",
    "nest-asyncio",
    "sympy",
]

[dependency-groups]
heavy = [
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.10",
    "faiss-cpu>=1.13",
    "Pillow>=10.0",
    "lxml>=5.0",
]
dev = [
    "pytest",
    "matplotlib>=3.7",
    "ipykernel",
    "jedi",
    "Pygments",
    "nest-asyncio",
    "sympy",
]
