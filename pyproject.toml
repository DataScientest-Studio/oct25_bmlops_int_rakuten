[project]
name = "recommsystem-rakuten"
version = "0.1.0"
description = "Content-based recommender system for Rakuten dataset"
readme = "README.md"
requires-python = ">=3.10,<3.14"
# (1) Basis: Leicht + unverzichtbar + schnell installierbar
dependencies = [
    # Core
    "numpy>=1.26,<2.0",
    "pandas>=2.1,<3.0",
    "python-dateutil",
    "pytz",  # optional
    "psutil",
    "simplejson",

    # API / App
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "streamlit>=1.30",
    "prometheus-client>=0.20",

    # Data / Parsing
    "pymongo",
    "beautifulsoup4",
    "lxml>=5.0",
    "Pillow>=10.0",

    # UX / CLI
    "click>=8.1",
    "rich>=13.7",

    # Utils
    "python-dotenv>=1.0.1",
    "tqdm>=4.66",
]

[dependency-groups]
# (2) MLOps + klassische ML: mittel-schwer, aber nicht TF
mlops = [
    "scikit-learn>=1.3,<2.0",
    "scipy>=1.10,<2.0",
    "mlflow>=2.12",
    "docker>=7.0", 
]

# (3) Heavy: langsame Builds + C-Bibliotheken + GPU/CPU-Monster
heavy = [
    "tensorflow>=2.15",
    "faiss-cpu>=1.7",
    "sentence-transformers>=2.7",
]


# (4) Developer tooling
dev = [
    "pytest",
    "ruff",
    "matplotlib>=3.7",
    "ipykernel",
    "jedi",
    "nest-asyncio",
    "Pygments",
]
