x-airflow-common: &airflow-common
  #image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.8.1}
  #image: mymlops-airflow:2.8.1
  build:
    context: .
    dockerfile: Dockerfile.worker
  environment: &airflow-common-env
    DB_NAME: ${DB_NAME}
    COLLECTION_NAME: ${COLLECTION_NAME}
    MONGO_URI: ${MONGO_URI}
    LOCAL_ROOT: /opt/airflow
    LOCAL_DATA: /opt/airflow/data
    LOCAL_VENV: /opt/airflow/venv

    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_URI}
    AIRFLOW__CELERY__RESULT_BACKEND: ${AIRFLOW_RESULT_BACKEND}
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # AIRFLOW__CORE__LOAD_EXAMPLES: "true"
    AIRFLOW__API__AUTH_BACKEND: "airflow.api.auth.backend.basic_auth"
    # AIRFLOW__SMTP__SMTP_HOST: "smtp.gmail.com"
    # AIRFLOW__SMTP__SMTP_PORT: 587
    # AIRFLOW__SMTP__SMTP_USER: "de.airflow@gmail.com"
    # AIRFLOW__SMTP__SMTP_PASSWORD: "cfsrvkongsobheta"
    # AIRFLOW__SMTP__SMTP_MAIL_FROM: "de.airflow@gmail.com"

    #AIRFLOW_ADDITIONAL_PACKAGES: ${AIRFLOW_ADDITIONAL_PACKAGES}
  volumes:
    - /mnt/c/Users/User/Desktop/MyMLOps/airflow/dags:/opt/airflow/dags
    - /mnt/c/Users/User/Desktop/MyMLOps/airflow/logs:/opt/airflow/logs
    - /mnt/c/Users/User/Desktop/MyMLOps/airflow/plugins:/opt/airflow/plugins
    - /mnt/c/Users/User/Desktop/MyMLOps/src:/opt/airflow/src
    - /mnt/c/Users/User/Desktop/MyMLOps/src/utils:/opt/airflow/src/utils
    - /mnt/c/Users/User/Desktop/MyMLOps/scripts:/opt/airflow/scripts
    - /mnt/c/Users/User/Desktop/MyMLOps/data:/opt/airflow/data
  user: "0:0"
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
    # mongodb:
    #   condition: service_started

services:
  postgres:
    image: postgres:13
    container_name: airflow-postgres
    networks:
      - mlops-net
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "airflow" ]
      interval: 5s
      retries: 5
    restart: always

  redis:
    image: redis:latest
    container_name: airflow-redis
    networks:
      - mlops-net
    ports:
      - 6379:6379
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 30s
      retries: 50
    restart: always

  airflow-webserver:
    <<: *airflow-common
    #image: mymlops-airflow-webserver:2.8.1
    command: webserver
    container_name: airflow-webserver
    networks:
      - mlops-net
    ports:
      - 8080:8080
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    #image: mymlops-airflow-scheduler:2.8.1
    command: scheduler
    container_name: airflow-scheduler
    networks:
      - mlops-net
    healthcheck:
      test: [ "CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"' ]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always

  airflow-worker:
    <<: *airflow-common
    #build:
    #  context: .
    #  dockerfile: Dockerfile.worker
    #image: mymlops-airflow-worker:2.8.1
    command: celery worker
    container_name: airflow-worker
    networks:
      - mlops-net
    volumes:
      - /mnt/c/Users/User/Desktop/MyMLOps/airflow/dags:/opt/airflow/dags
      - /mnt/c/Users/User/Desktop/MyMLOps/airflow/logs:/opt/airflow/logs
      - /mnt/c/Users/User/Desktop/MyMLOps/airflow/plugins:/opt/airflow/plugins
      - /mnt/c/Users/User/Desktop/MyMLOps/src:/opt/airflow/src
      - /mnt/c/Users/User/Desktop/MyMLOps/src/utils:/opt/airflow/src/utils
      - /mnt/c/Users/User/Desktop/MyMLOps/scripts:/opt/airflow/scripts
      - /mnt/c/Users/User/Desktop/MyMLOps/data:/opt/airflow/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c " airflow db "
    restart: "no"
    networks:
      - mlops-net
    environment:
      <<: *airflow-common-env
      _AAIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow

  flower:
    <<: *airflow-common
    command: celery flower
    networks:
      - mlops-net
    ports:
      - 5555:5555
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:5555/" ]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always

#  mongodb:
#    image: mongo:4.4
#    container_name: airflow-mongodb
#    restart: always
#    ports:
#      - "27017:27017"
#    environment:
#      MONGO_USERNAME: ${MONGO_USERNAME}
#      MONGO_PASSWORD: ${MONGO_PASSWORD}
#    volumes:
#      - mongo-db-volume:/data/database

volumes:
  postgres-db-volume:
  mongo-db-volume:

networks:
  mlops-net:
    external: true
